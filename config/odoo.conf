; =============================================================================
; odoo.conf per Odoo 20. Montata in /etc/odoo (read-only) dal compose,
; copia di default anche nell'immagine.
;
; Attive: solo quello che serve in questo stack.
; Commentate: tutte le altre opzioni, con il default di Odoo 20.
; Escluse solo le opzioni da riga di comando (-i, -u, -P, --save, --stop-after-init, test).
;
; Credenziali DB NON qui: l'entrypoint dell'immagine prende host, utente e
; password da env (HOST, USER, PASSWORD, da .env).
; =============================================================================

[options]

; --- Addon -------------------------------------------------------------------
; Path degli addon: devono combaciare con le COPY nel Dockerfile.
addons_path = /opt/odoo/extra-addons/contrib,/opt/odoo/extra-addons/custom

; Filestore, sessioni, asset. Volume odoo-data.
data_dir = /var/lib/odoo

; --- HTTP --------------------------------------------------------------------
; Obbligatorio nel container: il default 127.0.0.1 non e' raggiungibile dal
; port mapping Docker. 0.0.0.0 = tutte le interfacce del container.
http_interface = 0.0.0.0
; http_port = 8069
; http_enable = True
; gevent_port = 8072
; Dietro il proxy HTTPS di produzione: senza, robots.txt e sitemap escono in http://
; (Odoo ignora X-Forwarded-Proto/Host). Il proxy deve inviare X-Forwarded-Proto https.
proxy_mode = True
; x_sendfile = False
; websocket_keep_alive_timeout = 3600
; websocket_rate_limit_burst = 10
; websocket_rate_limit_delay = 0.2

; --- Database ----------------------------------------------------------------
; NON impostare db_host, db_user, db_password qui: l'entrypoint li passa da env.
; db_host =
; db_port = None
; db_user =
; db_password =
; db_name =
; db_template = template0
; db_maxconn = 64
; db_maxconn_gevent = None
; db_app_name = odoo-{pid}
; db_sslmode = prefer
; db_system = postgres
; db_replica_host = None
; db_replica_port = None
; pg_path =
; dbfilter =
; Nasconde l'elenco DB sulla login page. Consigliato in produzione.
; list_db = True

; --- Sicurezza ---------------------------------------------------------------
; Master password (gestione database). Il default di Odoo e' 'admin':
; impostarla prima di esporre la porta su rete. Non committarla in chiaro.
; admin_passwd = admin

; --- Email (SMTP) ------------------------------------------------------------
; email_from =
; from_filter =
; smtp_server = localhost
; smtp_port = 25
; smtp_ssl = False
; smtp_user =
; smtp_password =
; smtp_ssl_certificate_filename =
; smtp_ssl_private_key_filename =

; --- Processi e limiti -------------------------------------------------------
; workers = 0 : server single-process (sviluppo). Con workers > 0 Odoo usa
; i worker gevent e il longpolling su gevent_port.
workers = 0
; gevent_workers = 1
; max_cron_threads = 2
; limit_request = 65536
; limit_time_cpu = 60
; limit_time_real = 120
; limit_time_real_cron = -1
; limit_time_worker_cron = 0
; limit_memory_soft = 2147483648
; limit_memory_hard = 2684354560
; limit_memory_soft_gevent = None
; limit_memory_hard_gevent = None
; osv_memory_count_limit = 0
; transient_age_limit = 1.0

; --- Log ---------------------------------------------------------------------
; log_level = info
; log_handler = :INFO
; log_db =
; log_db_level = warning
; logfile =
; log_config =
; syslog = False

; --- Moduli e avvio ----------------------------------------------------------
; server_wide_modules = base,rpc,web
; skip_auto_install = False
; with_demo = False
; load_language =
; overwrite_existing_translations = False
; unaccent = False
; unsafe_policy = log
; pre_upgrade_scripts =
; upgrade_path =

; --- Varie -------------------------------------------------------------------
; bin_path =
; csv_internal_sep = ,
; default_productivity_apps = False
; import_file_maxbytes = 10485760
; import_file_timeout = 3
; import_url_regex = ^(?:http|https)://
; proxy_access_token =
; publisher_warranty_url = http://services.odoo.com/publisher-warranty/
; geoip_city_db = /usr/share/GeoIP/GeoLite2-City.mmdb
; geoip_country_db = /usr/share/GeoIP/GeoLite2-Country.mmdb
; dev_mode =
; pidfile =
; reportgz = False
; screencasts =
; screenshots = /tmp/odoo_tests

[colors]
; pid = never
; loglevel = auto
; session_id = never
; http_request_line = auto
; http_response_body = auto
; perf = auto
; cursor_mode = auto
; sql = auto
