[options]
; Config esterna: copiata in /etc/odoo/odoo.conf dal Dockerfile.
; Credenziali DB NON qui: db_host arriva da env HOST, utente/password da USER/PASSWORD (.env).

; Path addon: devono combaciare con le COPY nel Dockerfile.
addons_path = /opt/odoo/extra-addons/contrib,/opt/odoo/extra-addons/custom
data_dir = /var/lib/odoo

; Odoo 20 bind di default su 127.0.0.1 (irraggiungibile dal port mapping Docker).
; 0.0.0.0 = ascolta su tutte le interfacce del container.
http_interface = 0.0.0.0

db_maxconn = 64
log_level = info
workers = 0

; Per nascondere l'elenco DB sulla login page (produzione), decommentare:
; list_db = False

; admin_passwd (master password) non impostata qui: non va committata in chiaro.
; Default sorgente Odoo 20: 'admin'. Impostarla prima di esporre la porta su rete.
