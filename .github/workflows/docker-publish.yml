name: Build, test and publish Odoo image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Repo "manprint/torrepulia-20" -> ghcr.io/manprint/torrepulia-20 (nome in minuscolo)
  IMAGE_NAME: ${{ github.repository }}
  LOCAL_IMAGE: torrepulia-odoo:ci
  PG_PASSWORD: ci-password

jobs:
  test:
    name: Build and test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start PostgreSQL 17
        run: |
          docker network create odoo-ci
          docker run -d --name pg --network odoo-ci \
            -e POSTGRES_USER=odoo \
            -e POSTGRES_PASSWORD=${{ env.PG_PASSWORD }} \
            -e POSTGRES_DB=postgres \
            postgres:17

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U odoo -d postgres; then exit 0; fi
            sleep 2
          done
          docker logs pg
          exit 1

      - name: Install dummy modules into a fresh database
        run: |
          docker run --rm --network odoo-ci \
            -e HOST=pg \
            -e USER=odoo \
            -e PASSWORD=${{ env.PG_PASSWORD }} \
            ${{ env.LOCAL_IMAGE }} \
            -d odoo_ci -i base,dummy_contrib,dummy_custom --stop-after-init

      - name: Verify dummy modules are installed
        run: |
          states=$(docker exec pg psql -U odoo -d odoo_ci -At -c \
            "select name || '=' || state from ir_module_module where name in ('dummy_contrib','dummy_custom') order by name")
          echo "$states"
          test "$(echo "$states" | grep -c '=installed$')" = "2"

      - name: Start Odoo server
        run: |
          docker run -d --name odoo-ci --network odoo-ci \
            -e HOST=pg \
            -e USER=odoo \
            -e PASSWORD=${{ env.PG_PASSWORD }} \
            -p 127.0.0.1:8069:8069 \
            ${{ env.LOCAL_IMAGE }}

      - name: Wait for Odoo healthcheck
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' odoo-ci)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 3
          done
          docker logs odoo-ci
          exit 1

      - name: Check web endpoints
        run: |
          curl -fsS -o /dev/null -w 'health %{http_code}\n' http://127.0.0.1:8069/web/health
          curl -fsS -o /dev/null -w 'login %{http_code}\n' http://127.0.0.1:8069/web/login

      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs odoo-ci || true
          docker logs pg || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f odoo-ci pg || true
          docker network rm odoo-ci || true

  publish:
    name: Publish image to GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on VM
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    env:
      VM_HOST: 212.227.88.91
      VM_USER: ubuntu
    steps:
      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Compose up on VM (dind-to20)
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          dc() { docker exec -u alpine -w /home/alpine/docker dind-to20 docker compose "$@"; }
          dk() { docker exec -u alpine dind-to20 docker "$@"; }
          # Immagine in esecuzione vs immagine appena scaricata per il servizio odoo
          odoo_image() { dk inspect "$(dc ps -q odoo)" --format '{{.Image}} avviato {{.State.StartedAt}}'; }
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "::group::docker compose up -d (pull always)"
          echo "Odoo prima: $(odoo_image 2>/dev/null || echo n/d)"
          dc up -d
          tag=$(dk inspect "$(dc ps -q odoo)" --format '{{.Config.Image}}')
          want=$(dk image inspect "$tag" --format '{{.Id}}')
          if [ "$(odoo_image | cut -d' ' -f1)" != "$want" ]; then
            echo "::warning::odoo non ricreato sulla nuova immagine $tag: force-recreate"
            START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            dc up -d --force-recreate odoo
          fi
          echo "Odoo dopo:  $(odoo_image) ($tag)"
          echo "::endgroup::"

          echo "::group::Attesa stack e Odoo interno (max 3 min)"
          deadline=$(( $(date +%s) + 180 ))
          while :; do
            ps=$(dc ps -a --format '{{.Service}} {{.State}} {{.Health}}')
            echo "$ps"
            [ -n "$ps" ] || { echo "::error::nessun container nel compose"; exit 1; }
            if echo "$ps" | awk '$2 != "running" || $3 == "unhealthy" { bad = 1 } END { exit !bad }'; then
              echo "::error::container non running o unhealthy"
              dc logs --no-color --tail=100
              exit 1
            fi
            if ! echo "$ps" | awk '$3 == "starting" { s = 1 } END { exit !s }'; then
              body=$(curl -fsS -m 10 http://127.0.0.1:10000/web/health 2>/dev/null || true)
              grep -q pass <<<"$body" && break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timeout 3 min: stack non healthy o Odoo non risponde su 127.0.0.1:10000"
              dc logs --no-color --tail=100
              exit 1
            fi
            sleep 5
          done
          echo "Odoo interno: $body"
          echo "::endgroup::"

          echo "::group::Log dal deploy"
          logs=$(dc logs --no-color --since "$START" 2>&1 || true)
          if grep -qE 'CRITICAL|Traceback' <<<"$logs"; then
            echo "::error::errori critici nei log dal deploy"
            grep -E -B2 -A40 'CRITICAL|Traceback' <<<"$logs" | head -n 150
            exit 1
          fi
          echo "ERROR nei log: $(grep -c ' ERROR ' <<<"$logs" || true)"
          echo "::endgroup::"
          REMOTE

      - name: Deploy result
        run: echo "::notice::DEPLOY OK - stack healthy, Odoo risponde internamente su 127.0.0.1:10000 della VM (porta pubblica 10000 non ancora aperta)"
